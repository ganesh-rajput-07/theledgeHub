<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · KnowledgeHub Licensing</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/admin.css"></head>
<body><div class="login">
  <h1>Licence admin</h1><p class="sub">KnowledgeHub AI</p>
  {% if error %}<div class="msg err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus autocomplete="username"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn wide">Sign in</button>
  </form>
</div></body></html>
