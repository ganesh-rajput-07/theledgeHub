{% extends "site/_account.html" %}{% block title %}Password · {{ brand }}{% endblock %}
{% block main %}
<div class="head"><div><h1>Password</h1><p class="muted">Used on this website and in the desktop app.</p></div></div>
<form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label>Current password</label><input name="current_password" type="password" required autocomplete="current-password"></div>
  <div class="field"><label>New password <span class="hint">(12+ characters)</span></label><input name="new_password" type="password" required minlength="12" autocomplete="new-password"></div>
  <div class="field"><label>Repeat new password</label><input name="confirm_password" type="password" required minlength="12" autocomplete="new-password"></div>
  <button class="btn">Change password</button>
</form>
{% endblock %}
