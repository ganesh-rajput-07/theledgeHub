<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Admin{% endblock %} · KnowledgeHub Licensing</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="/static/admin.css"></head>
<body><div class="layout">
<aside class="side">
  <div class="brand">KnowledgeHub<small>Licence admin</small></div>
  <nav>
    <a href="/admin/" class="{{ 'on' if nav == 'home' }}">Dashboard</a>
    <a href="/admin/firms" class="{{ 'on' if nav == 'firms' }}">Firms</a>
    <a href="/admin/plans" class="{{ 'on' if nav == 'plans' }}">Plans &amp; prices</a>
    <a href="/admin/payments" class="{{ 'on' if nav == 'payments' }}">Payments</a>
    <a href="/admin/settings" class="{{ 'on' if nav == 'settings' }}">Settings</a>
    <a href="/admin/activity" class="{{ 'on' if nav == 'activity' }}">Activity log</a>
  </nav>
  <div class="who">{{ me.name }}<br><span class="muted">{{ me.email }}</span><br>
    <a href="/admin/account">My password</a> ·
    <form method="post" action="/admin/logout" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Sign out</button></form>
  </div>
</aside>
<main>
  {% if flash %}<div class="msg ok">{{ flash }}</div>{% endif %}
  {% if error %}<div class="msg err">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main></div>
<script src="/static/admin.js"></script>
</body></html>
