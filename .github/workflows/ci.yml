name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: knowledgehub
          POSTGRES_PASSWORD: knowledgehub
          POSTGRES_DB: knowledgehub
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U knowledgehub" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --index-strategy unsafe-best-match -r requirements-dev.txt
      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=$(.venv/bin/python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(.venv/bin/python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')|" .env
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Lint (incl. security rules)
        run: |
          .venv/bin/ruff check app tests evaluation
          .venv/bin/ruff format --check app tests evaluation
      - name: Migrations apply and match the models
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
      - name: Tests (unit, integration, tenant isolation, RAG quality)
        run: .venv/bin/python -m pytest -q
      - name: Dependency vulnerability audit
        run: .venv/bin/pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx next build
      - run: npm audit --omit=dev

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API and web images
        run: |
          cp backend/.env.example backend/.env
          docker compose --env-file backend/.env --profile app build
